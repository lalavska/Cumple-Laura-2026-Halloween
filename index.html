<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Cumpleaños</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background-image: url('fondo1.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        .container {
            position: relative;
            width: 90vw; 
            max-width: 600px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. EL SOBRE */
        .envelope-img {
            width: 100%;
            height: auto;
            position: absolute;
            bottom: 0;
            z-index: 10;
            transition: all 0.5s ease;
            cursor: pointer;
        }
        
        .container.open .envelope-img { 
            z-index: 1; 
            pointer-events: none;
            cursor: default;
        }

        /* 2. LA CARTA (Centro - Parte 1) */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: 80%;
            height: 350px;
            background-image: url('carta-doblada.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: zoom-in;
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
        }
        .container.open .letter {
            opacity: 1;
            transform: translateX(-50%) translateY(-120px) rotate(0deg);
            z-index: 15;
            pointer-events: auto;
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
        }

        /* 3. EL TICKET (Derecha - Parte 2 de la Carta) */
        .receipt {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 350px; 
            background-image: url('ticket.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: zoom-in;
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
        .container.open .receipt {
            opacity: 1;
            z-index: 25;
            transform: translateY(-135px) translateX(100px) rotate(6deg);
            pointer-events: auto;
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        /* 4. LA IMAGEN DE INVITACIÓN (Izquierda) */
        .invitacion-img {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 280px; 
            background-image: url('invitacion.png'); 
            background-size: cover;
            background-position: center;
            border-radius: 5px;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: zoom-in;
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
        .container.open .invitacion-img {
            opacity: 1;
            z-index: 26;
            transform: translateY(-130px) translateX(-240px) rotate(-6deg);
            pointer-events: auto;
            -webkit-mask-image: none;
            mask-image: none;
        }

        /* 5. ZOOM UNIFICADO */
        .receipt.unfold, .letter.unfold, .invitacion-img.unfold {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) !important;
            width: 95vw !important;
            height: 90vh !important;
            max-width: 800px !important; 
            z-index: 9999 !important; 
            box-shadow: 0 0 100px rgba(0,0,0,0.7); 
            cursor: zoom-out;
            background-size: contain !important;
            background-position: center !important;
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        /* =======================================================
           ESTILOS PARA MÓVILES (FONDO Y POSICIONAMIENTO)
           ======================================================= */
        @media (max-width: 768px) {
            body {
                background-image: url('fondo-movil.jpg') !important;
                background-size: cover;
                background-position: center;
                background-attachment: scroll;
            }

            .container {
                width: 95vw;
                height: 350px;
                /* Centramos el contenedor un poquito más arriba para que el sobre no quede abajo del todo */
                transform: translateY(-20px);
            }

            /* Redimensionamos los elementos para que no se corten en pantallas pequeñas */
            .letter {
                width: 85%;
                height: 250px;
            }

            .receipt {
                width: 140px;
                height: 240px;
            }

            .invitacion-img {
                width: 120px;
                height: 170px;
            }

            /* Posiciones de apertura adaptadas a móvil */
            .container.open .letter {
                transform: translateX(-50%) translateY(-85px) rotate(0deg);
            }

            .container.open .receipt {
                transform: translateY(-95px) translateX(55px) rotate(5deg);
            }

            .container.open .invitacion-img {
                transform: translateY(-90px) translateX(-145px) rotate(-5deg);
            }
        }

        /* =======================================================
           ESTILOS DEL BOTÓN FLOTANTE Y FORMULARIO (MORADO Y NEGRO)
           ======================================================= */
        .rsvp-floating-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #964880;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10000;
            transition: transform 0.2s, background-color 0.2s;
        }

        .rsvp-floating-btn:hover {
            background-color: #723561;
            transform: scale(1.05);
        }

        .rsvp-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .rsvp-content {
            background: #1a1a1a;
            color: #f0f0f0;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            font-family: 'Montserrat', sans-serif;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #964880;
        }

        .rsvp-content h3 {
            color: #964880;
            margin-top: 0;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #bbb;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .rsvp-content label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
            color: #ddd;
        }

        .rsvp-content input, 
        .rsvp-content select, 
        .rsvp-content textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        .rsvp-content input:focus, 
        .rsvp-content select:focus, 
        .rsvp-content textarea:focus {
            border-color: #964880;
            outline: none;
        }

        .send-btn {
            background-color: #964880;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background-color: #723561;
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <img src="sobre-cerrado.png" id="envelope" class="envelope-img" onclick="openEnvelope()">
        
        <!-- Parte 1 de la carta -->
        <div class="letter" id="laCarta"></div>

        <!-- Parte 2 de la carta (ticket.png) -->
        <div class="receipt" id="elTicket"></div>

        <!-- Imagen de invitación (invitacion.png) -->
        <div class="invitacion-img" id="laInvitacion"></div>
    </div>

    <!-- Botón flotante para confirmar asistencia -->
    <button class="rsvp-floating-btn" onclick="toggleRsvpModal()">💌 Confirmar Asistencia</button>

    <!-- Ventana flotante (Modal) con el formulario -->
    <div id="rsvpModal" class="rsvp-modal">
        <div class="rsvp-content">
            <span class="close-btn" onclick="toggleRsvpModal()">&times;</span>
            <h3>Buzón de Laura 💌</h3>
            <p style="font-size: 13px; color: #aaa; text-align: center;">¡Rellena esto para confirmar tu asistencia, canciones y pijamas!</p>
            
            <form id="rsvpForm">
                <label>Tu Nombre:</label>
                <input type="text" name="nombre" required placeholder="Ej: Tu amigo el payo">

                <label>¿Asistes al cumpleaños? (¡Obligatorio disfraz!):</label>
                <select name="asistencia">
                    <option value="si">¡Sí, obvio bro!</option>
                    <option value="no">Me pilla mal / No puedo /Soy autista :(</option>
                </select>

                <label>¿Te quedas a dormir (Fiesta de pijamas)?</label>
                <select name="dormir">
                    <option value="si">¡Sí, lol!</option>
                    <option value="no">No me quedo /Soy autista / Me vuelvo a casa</option>
                    <option value="no_voy">No voy a asistir / Soy autista </option>
                </select>

                <label>Canción si ganas un premio / Karaoke (especifica si quieres actuación en solitario o etc):</label>
                <input type="text" name="cancion" placeholder="Dime el título y artista">

                <label>¿Algo que decir (alergias, bebidas, pides disfraz...)?</label>
                <textarea name="mensaje" placeholder="Cuéntame tu vida"></textarea>

                <button type="submit" class="send-btn" id="submitBtn">¡Enviar respuesta a Laura!</button>
            </form>
        </div>
    </div>

    <script>
        const box = document.getElementById('box');
        const img = document.getElementById('envelope');
        const carta = document.getElementById('laCarta');
        const ticket = document.getElementById('elTicket');
        const invitacion = document.getElementById('laInvitacion');

        // Abre el sobre
        function openEnvelope() {
            if (!box.classList.contains('open')) {
                box.classList.add('open');
                img.src = 'sobre-abierto.png';
                if (ticket) ticket.style.transitionDelay = "0.1s";
                if (invitacion) invitacion.style.transitionDelay = "0.1s";
            }
        }

        // Restaura la página al estado inicial del sobre cerrado
        function resetEnvelopeToClosed() {
            box.classList.remove('open');
            img.src = 'sobre-cerrado.png';
            if (ticket) {
                ticket.style.transitionDelay = "0s";
                ticket.classList.remove('unfold');
            }
            if (invitacion) {
                invitacion.style.transitionDelay = "0s";
                invitacion.classList.remove('unfold');
            }
            if (carta) {
                carta.style.transitionDelay = "0s";
                carta.classList.remove('unfold');
            }
        }

        // Abrir y cerrar la ventana flotante de confirmación (RSVP)
        function toggleRsvpModal() {
            const modal = document.getElementById('rsvpModal');
            if (!modal) return;
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
            }
        }

        // Envío del formulario mediante AJAX para evitar la pantalla de Formspree
        const rsvpForm = document.getElementById('rsvpForm');
        rsvpForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Enviando...";
            submitBtn.disabled = true;

            const formData = new FormData(rsvpForm);

            try {
                const response = await fetch('https://formspree.io/f/xwlvawka', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('¡Mensaje enviado con éxito! ¡Gracias por responder, Laura ya lo ha recibido!');
                    rsvpForm.reset(); 
                    toggleRsvpModal(); 
                    resetEnvelopeToClosed(); 
                } else {
                    alert('Hubo un error al enviar. Por favor, inténtalo de nuevo.');
                }
            } catch (error) {
                alert('Error de conexión. Comprueba tu red.');
            } finally {
                submitBtn.textContent = "¡Enviar respuesta a Laura!";
                submitBtn.disabled = false;
            }
        });

        // Zoom para la primera parte de la carta
        if (carta) {
            carta.addEventListener('click', (e) => {
                if (box.classList.contains('open')) {
                    e.stopPropagation();
                    carta.classList.toggle('unfold');
                    if (ticket) ticket.classList.remove('unfold');
                    if (invitacion) invitacion.classList.remove('unfold');
                }
            });
        }

        // Zoom para el ticket
        if (ticket) {
            ticket.addEventListener('click', (e) => {
                if (box.classList.contains('open')) {
                    e.stopPropagation();
                    ticket.classList.toggle('unfold');
                    if (carta) carta.classList.remove('unfold');
                    if (invitacion) invitacion.classList.remove('unfold');
                }
            });
        }

        // Zoom para la invitación
        if (invitacion) {
            invitacion.addEventListener('click', (e) => {
                if (box.classList.contains('open')) {
                    e.stopPropagation();
                    invitacion.classList.toggle('unfold');
                    if (carta) carta.classList.remove('unfold');
                    if (ticket) ticket.classList.remove('unfold');
                }
            });
        }
    </script>
</body>
</html>
